<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="THESA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>THESA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="mark" src="icon-192.png" alt="THESA knight" />
      <div>
        <p class="team" id="teamName">THESA</p>
        <p class="label">Dallas Angels Classic</p>
      </div>
    </div>
    <label class="pick-label" for="teamPick">Tracking</label>
    <select id="teamPick"></select>
    <p class="phase" id="phase"></p>
    <p class="event-name" id="eventName"></p>
    <p class="event-meta" id="eventMeta"></p>
  </header>
  <main>
    <section class="hero" id="nextCard"></section>
    <div id="panelPool">
      <section><h2>Pool standings</h2><div class="table-wrap" id="standings"></div></section>
      <section><h2>Court matches</h2><div id="matches"></div></section>
    </div>
    <div id="panelBracket" class="hidden"><section><h2>Saturday</h2><p class="note" id="bracketNote"></p><div id="bracketMatches"></div></section></div>
    <div id="panelRot" class="hidden">
      <section class="rot-track">
        <h2>Live rotation</h2>
        <div class="rot-status"><strong id="rotNum">Rotation 1</strong><span id="rotMeta"></span></div>
        <div class="rot-chips"><button type="button" class="chip on" id="serveChip">Serving</button><button type="button" class="chip" id="recvChip">Receiving</button></div>
        <div class="rot-actions"><button type="button" class="ghost" id="rotPrev">Prev</button><button type="button" id="sideOut">Side-out</button><button type="button" class="ghost" id="weScored">Point</button><button type="button" class="ghost" id="rotNext">Next</button></div>
        <div class="rot-grid" id="rotBoards"></div>
        <button type="button" class="ghost" id="rotReset">Reset</button>
      </section>
      <section><div class="name-grid"><label>S1 <input id="nameS1" maxlength="12" /></label><label>S2 <input id="nameS2" maxlength="12" /></label><label>OH1 <input id="nameOH1" maxlength="12" /></label><label>OH2 <input id="nameOH2" maxlength="12" /></label><label>MB <input id="nameMB" maxlength="12" /></label><label>Libero <input id="nameL" maxlength="12" /></label></div></section>
      <section><div id="rotAll"></div></section>
    </div>
    <section><p class="note" id="notes"></p></section>
  </main>
  <nav class="dock">
    <button type="button" class="tab on" id="tabPool">Pool</button>
    <button type="button" class="tab" id="tabBracket">Saturday</button>
    <button type="button" class="tab" id="tabRot">Rotations</button>
  </nav>
  <aside class="install hidden" id="installSheet">
    <div class="install-row">
      <img src="icon-192.png" alt="" />
      <div>
        <strong>Install THESA</strong>
        <p id="installCopy">Add the board to your home screen. It opens full screen, with the knight icon.</p>
      </div>
    </div>
    <div class="install-actions">
      <button type="button" id="installBtn">Install</button>
      <button type="button" class="ghost" id="installLater">Not now</button>
    </div>
  </aside>
  <script src="data.js?v=26"></script>
  <script src="rotations.js?v=26"></script>
  <script src="app.js?v=26"></script>
  <script>
    function show(name) {
      document.getElementById("tabPool").classList.toggle("on", name === "pool");
      document.getElementById("tabBracket").classList.toggle("on", name === "bracket");
      document.getElementById("tabRot").classList.toggle("on", name === "rot");
      document.getElementById("panelPool").classList.toggle("hidden", name !== "pool");
      document.getElementById("panelBracket").classList.toggle("hidden", name !== "bracket");
      document.getElementById("panelRot").classList.toggle("hidden", name !== "rot");
      document.getElementById("nextCard").classList.toggle("hidden", name === "rot");
    }
    document.getElementById("tabPool").onclick = function () { show("pool"); };
    document.getElementById("tabBracket").onclick = function () { show("bracket"); };
    document.getElementById("tabRot").onclick = function () { show("rot"); };
    var bm = document.getElementById("bracketMatches");
    if (bm) bm.innerHTML = "<p class=\"hint\">Saturday bracket posts after Friday pool.</p>";
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    var deferred;
    var sheet = document.getElementById("installSheet");
    var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    function openSheet() { if (!standalone && !localStorage.getItem("thesa:install-dismiss")) sheet.classList.remove("hidden"); }
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferred = e;
      openSheet();
    });
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios && !standalone) {
      document.getElementById("installCopy").textContent = "Tap Share, then Add to Home Screen. It opens as an app with the knight icon.";
      document.getElementById("installBtn").textContent = "How to add";
      openSheet();
    }
    document.getElementById("installBtn").onclick = function () {
      if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { sheet.classList.add("hidden"); }); deferred = null; }
      else sheet.classList.add("hidden");
    };
    document.getElementById("installLater").onclick = function () {
      localStorage.setItem("thesa:install-dismiss", "1");
      sheet.classList.add("hidden");
    };
  </script>
</body>
</html>
